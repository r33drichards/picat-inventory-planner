services:
  minecraft:
    image: itzg/minecraft-server:java21
    ports:
      - "127.0.0.1:${E2E_MC_PORT:-25565}:25565"
    environment:
      EULA: "${EULA:?Set EULA=TRUE after accepting the Minecraft EULA}"
      TYPE: PAPER
      VERSION: "1.21.4"
      LEVEL_TYPE: minecraft:flat
      ONLINE_MODE: "FALSE"
      MODE: adventure
      FORCE_GAMEMODE: "TRUE"
      DIFFICULTY: peaceful
      GENERATE_STRUCTURES: "FALSE"
      SPAWN_ANIMALS: "FALSE"
      SPAWN_MONSTERS: "FALSE"
      SPAWN_NPCS: "FALSE"
      VIEW_DISTANCE: "6"
      SIMULATION_DISTANCE: "4"
      MEMORY: 1G
    volumes:
      - world:/data
volumes:
  world:
