name: Minecraft E2E

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: minecraft-e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  paper:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'minecraft-e2e') &&
       (github.event.action != 'labeled' || github.event.label.name == 'minecraft-e2e'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the planner from the checkout
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.21
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.21
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash build-wasm.sh
      - name: Install the bot and recording dependencies
        run: |
          npm install --no-save --package-lock=false mineflayer@4.39.0 mineflayer-pathfinder@2.4.5 prismarine-viewer@1.33.0 canvas@3.2.0 playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run the Paper integration test
        env:
          EULA: 'TRUE'
        run: node integration/e2e.cjs
      - name: Upload the recording and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-e2e
          path: integration-results/
          if-no-files-found: ignore
